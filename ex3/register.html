<!DOCTYPE html>
<html>
<head>
<title>Registration Page</title>
</head>
<body style="margin:0; padding:20px; font-family:Arial, Helvetica, sans-serif; background-color:#e6f9fb; background-image:radial-gradient(circle at top left, #c9f2f6 0%, #e6f9fb 60%); background-position:top left; background-repeat:no-repeat; color:#222;">
<center>
<h1 style="background-color:#0d7a86; color:#ffffff; border:3px solid #08525a; border-style:solid; padding:18px; border-radius:8px; margin-bottom:15px;">Online Shopping System</h1>
<h2 style="color:#0d7a86; margin:15px 0;">Registration Form</h2>

<form style="display:inline-block;">
<table border="1" cellpadding="8" style="border-collapse:collapse; background-color:#ffffff; border:2px solid #0d7a86; margin:15px 0;">
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Name</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><input type="text" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Email</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><input type="email" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Mobile Number</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><input type="number" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Gender</td>
<td style="border:1px solid #b8e6ea; padding:10px;">
<input type="radio" name="gender" style="margin-right:5px;">Male
<input type="radio" name="gender" style="margin-left:15px; margin-right:5px;">Female
</td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Address</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><textarea rows="3" cols="20" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></textarea></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Username</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><input type="text" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">Password</td>
<td style="border:1px solid #b8e6ea; padding:10px;"><input type="password" style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;"></td>
</tr>
<tr>
<td style="border:1px solid #b8e6ea; padding:10px;">City</td>
<td style="border:1px solid #b8e6ea; padding:10px;">
<select style="padding:6px; border:1px solid #8fd6dc; border-radius:4px;">
<option>Madurai</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Trichy</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" align="center" style="border:1px solid #b8e6ea; padding:10px;">
<input type="submit" value="Register" style="background-color:#0d7a86; color:#ffffff; border:none; padding:10px 18px; border-radius:5px; cursor:pointer;">
<input type="reset" value="Clear" style="background-color:#cccccc; color:#222; border:none; padding:10px 18px; border-radius:5px; cursor:pointer; margin-left:8px;">
</td>
</tr>
</table>
</form>

<br>
<span style="color:#222;">Already have an account?</span>
<a href="login.html" style="color:#0d7a86; font-weight:bold; text-decoration:none; margin-left:5px;">Login</a>
<br><br>
<a href="index.html" style="color:#0d7a86; text-decoration:none; font-weight:bold;">Home</a>
</center>
</body>
</html>
